name: Build ActionLock Free APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          if [ -f "actionlock_android_source.zip" ]; then
            unzip -o actionlock_android_source.zip
          fi
          SUB=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SUB" ]; then
            DIR=$(dirname "$SUB")
            if [ "$DIR" != "." ]; then
              cp -rf "$DIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionLock-Free-APK
          path: app/build/outputs/apk/debug/app-debug.apk
