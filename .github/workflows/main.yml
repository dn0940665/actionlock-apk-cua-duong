name: Build ActionLock Free APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix AndroidX & Prepare Project
        run: |
          if [ -f "actionlock_android_source.zip" ]; then
            unzip -o actionlock_android_source.zip
          fi
          SUB=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SUB" ]; then
            DIR=$(dirname "$SUB")
            if [ "$DIR" != "." ]; then
              cp -rf "$DIR"/* .
            fi
          fi
          HTML_FILE=$(find . -maxdepth 5 -name "*.html" | head -n 1)
          mkdir -p app/src/main/assets
          if [ -n "$HTML_FILE" ] && [ "$HTML_FILE" != "./app/src/main/assets/index.html" ]; then
            cp -f "$HTML_FILE" app/src/main/assets/index.html
          fi

          rm -rf app/src/main/java
          mkdir -p app/src/main/java/com/actionlock/free
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.actionlock.free"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.actionlock.free"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0.0-FREE"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="ActionLock Free"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveForegroundService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".AppBlockerAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/java/com/actionlock/free/MainActivity.kt
          package com.actionlock.free

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                  }

                  try {
                      val svcIntent = Intent(this, KeepAliveForegroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(svcIntent)
                      } else {
                          startService(svcIntent)
                      }
                  } catch (_: Exception) {}

                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.allowFileAccess = true

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          handleInterceptIntent(intent)
                      }
                  }
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread { request.grant(request.resources) }
                      }
                  }

                  webView.addJavascriptInterface(AndroidNativeBridge(), "AndroidNative")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleInterceptIntent(intent)
              }

              override fun onResume() {
                  super.onResume()
                  webView.evaluateJavascript("if(window.renderAll) window.renderAll();", null)
              }

              private fun handleInterceptIntent(intent: Intent?) {
                  val pkg = intent?.getStringExtra("INTERCEPTED_PACKAGE") ?: return
                  val label = intent.getStringExtra("INTERCEPTED_LABEL") ?: pkg
                  intent.removeExtra("INTERCEPTED_PACKAGE")
                  webView.evaluateJavascript(
                      "if(window.onNativeAppIntercepted) window.onNativeAppIntercepted('$pkg', '$label');",
                      null
                  )
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(packageName)
              }

              inner class AndroidNativeBridge {

                  @JavascriptInterface
                  fun getSystemStatusJson(): String {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val batteryIgnored = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          pm.isIgnoringBatteryOptimizations(packageName)
                      } else true
                      val overlayEnabled = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Settings.canDrawOverlays(this@MainActivity)
                      } else true

                      val obj = JSONObject()
                      obj.put("accessibilityEnabled", isAccessibilityServiceEnabled())
                      obj.put("overlayEnabled", overlayEnabled)
                      obj.put("batteryIgnored", batteryIgnored)
                      return obj.toString()
                  }

                  @JavascriptInterface
                  fun openAccessibilitySettings() {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  @JavascriptInterface
                  fun openOverlaySettings() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      }
                  }

                  @JavascriptInterface
                  fun requestIgnoreBatteryOptimizations() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val intent = Intent(
                              Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      }
                  }

                  @JavascriptInterface
                  fun getInstalledAppsJson(): String {
                      val pm = packageManager
                      val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                      val arr = JSONArray()
                      for (app in apps) {
                          if ((app.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && app.packageName != packageName) {
                              val item = JSONObject()
                              item.put("packageName", app.packageName)
                              item.put("name", pm.getApplicationLabel(app).toString())
                              arr.put(item)
                          }
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun syncLockedApps(jsonPayload: String) {
                      val prefs = getSharedPreferences("actionlock_prefs", Context.MODE_PRIVATE)
                      prefs.edit().putString("locked_apps_json", jsonPayload).apply()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/actionlock/free/AppBlockerAccessibilityService.kt
          package com.actionlock.free

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import org.json.JSONArray

          class AppBlockerAccessibilityService : AccessibilityService() {

              private var currentForegroundPkg: String = ""
              private val handler = Handler(Looper.getMainLooper())

              private val periodicExpiryChecker = object : Runnable {
                  override fun run() {
                      if (currentForegroundPkg.isNotEmpty() && currentForegroundPkg != packageName) {
                          checkAndBlockIfNeeded(currentForegroundPkg)
                      }
                      handler.postDelayed(this, 1000L)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  handler.post(periodicExpiryChecker)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg.startsWith("com.android.systemui") || pkg.contains("inputmethod")) return
                  currentForegroundPkg = pkg
                  if (pkg != packageName) {
                      checkAndBlockIfNeeded(pkg)
                  }
              }

              private fun checkAndBlockIfNeeded(pkg: String) {
                  val prefs = getSharedPreferences("actionlock_prefs", Context.MODE_PRIVATE)
                  val rawJson = prefs.getString("locked_apps_json", null) ?: return
                  val now = System.currentTimeMillis()

                  try {
                      val arr = JSONArray(rawJson)
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          val targetPkg = item.optString("packageName")
                          val isLocked = item.optBoolean("locked", false)
                          val expiryMs = item.optLong("unlockExpiryMs", 0L)
                          val appName = item.optString("appName", pkg)

                          if (targetPkg == pkg && isLocked && now > expiryMs) {
                              val interceptIntent = Intent(this, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                                  putExtra("INTERCEPTED_PACKAGE", pkg)
                                  putExtra("INTERCEPTED_LABEL", appName)
                              }
                              startActivity(interceptIntent)
                              break
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onInterrupt() {
                  handler.removeCallbacksAndMessages(null)
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/actionlock/free/KeepAliveForegroundService.kt
          package com.actionlock.free

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class KeepAliveForegroundService : Service() {

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "actionlock_guard_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(
                          channelId,
                          "ActionLock Protection Guard",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm?.createNotificationChannel(chan)
                  }

                  val openIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("ActionLock Free — AL-01 Đang Bảo Vệ")
                      .setContentText("Đang kiểm soát ứng dụng gây xao nhãng & đếm ngược thời gian mở khóa")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionLock-Free-APK
          path: app/build/outputs/apk/debug/app-debug.apk
